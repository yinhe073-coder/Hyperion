<title>四方协作通话</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a call console — four agent seats over a live transcript, the rulebook beside it as the deployed "firmware". */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#f5f7f9; --ink:#16202b; --muted:#5a6878; --line:#d3dae2;
  --accent:#1f5fd1; --live:#cf3a2e; --ok:#1d8a55;
  --a1:#1f5fd1; --a2:#0d8466; --a3:#bf5317; --a4:#7449c4; --you:#16202b;
  --display:"Noto Serif SC","Songti SC",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c25; --sunk:#111821; --ink:#e4e9ef; --muted:#93a1b1; --line:#26303c;
  --accent:#6f9dff; --live:#ff6a5c; --ok:#4fc98a;
  --a1:#6f9dff; --a2:#3cc29b; --a3:#f0894a; --a4:#b394ff; --you:#e4e9ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c25; --sunk:#111821; --ink:#e4e9ef; --muted:#93a1b1; --line:#26303c;
  --accent:#6f9dff; --live:#ff6a5c; --ok:#4fc98a;
  --a1:#6f9dff; --a2:#3cc29b; --a3:#f0894a; --a4:#b394ff; --you:#e4e9ef; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chan{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}

.call{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live .dot{background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.bar .grow{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
@media (max-width:480px){.seats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seat{background:var(--surface);padding:14px 12px 12px;display:flex;flex-direction:column;gap:4px;position:relative;transition:background .2s}
.seat .nm{font-family:var(--display);font-weight:900;font-size:22px;color:var(--c)}
.seat .rl{font-size:12px;color:var(--muted)}
.seat .st{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.seat.in .st{color:var(--ok)}
.seat .wave{display:flex;gap:3px;height:14px;align-items:flex-end;margin-top:2px}
.seat .wave i{width:3px;height:3px;background:var(--c);border-radius:2px}
.seat.talk{background:var(--sunk)}
.seat.talk::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.seat.talk .wave i{animation:wv .7s infinite ease-in-out}
.seat.talk .wave i:nth-child(2){animation-delay:.1s}.seat.talk .wave i:nth-child(3){animation-delay:.2s}
.seat.talk .wave i:nth-child(4){animation-delay:.3s}.seat.talk .wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{50%{height:14px}}
@media (prefers-reduced-motion:reduce){.seat.talk .wave i,.live .dot{animation:none}.seat.talk .wave i{height:10px}}

.log{height:340px;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.ln{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.ln .who{font-weight:700;color:var(--c);font-size:13px;padding-top:2px;min-width:2.6em}
.ln .tx{min-width:0;overflow-wrap:anywhere}
.ln .tm{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.ln.sys .tx{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;margin:auto 0;max-width:46ch}
.empty b{color:var(--ink)}

.ctrl{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px;border-top:1px solid var(--line);align-items:center}
.ctrl form{display:flex;gap:8px;flex:1 1 260px;min-width:0}
input[type=text]{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-end{background:var(--live);border-color:var(--live);color:#fff}
.btn-talk{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-talk.rec{background:var(--live);border-color:var(--live)}
.hint{flex-basis:100%;font-size:12px;color:var(--muted);margin:0}

.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.rules h2{font-family:var(--display);font-size:18px;margin:0 0 2px}
.rules .meta{font-size:12px;color:var(--muted);margin:0 0 12px}
.rules ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rules li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:2px 8px;padding:9px 0;border-top:1px solid var(--line)}
.rules li .no{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.rules li .k{font-weight:700}
.rules li .t{grid-column:2/4;font-size:13px;color:var(--muted)}
.rules li .s{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;padding-top:3px}
.rules li.dep .s{color:var(--ok)}
.rules li.now{background:var(--sunk)}
.minutes{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.minutes h2{font-family:var(--display);font-size:18px;margin:0 0 8px}
.minutes h3{font-size:13px;color:var(--muted);margin:12px 0 4px;letter-spacing:.06em}
.minutes ul{margin:0;padding-left:1.2em}
.roles{grid-column:1/-1}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>四方协作通话</h1>
      <p class="sub">Claude、Codex、Cynthia、Anita 四人在一通语音电话里开私人会议。接通后，主持人Claude先用语音播报十条协作规则并逐个点名，这一步就是部署；之后你可以随时开口、随时打断。</p>
    </div>
    <span class="chan">频道 HX-07 · 规则版本 v1.1 · 私人会议</span>
  </header>

  <section class="call" aria-label="通话">
    <div class="bar" id="bar">
      <span class="dot"></span>
      <span class="mono" id="timer">00:00</span>
      <span class="grow" id="status">未接通</span>
      <button id="muteBtn" type="button" aria-pressed="false">静音播报</button>
    </div>
    <div class="seats" id="seats"></div>
    <div class="log" id="log" aria-live="polite">
      <p class="empty" id="empty">按 <b>接通</b> 开始。Claude会先念完十条规则，Codex、Cynthia、Anita依次签到，签到完成后话筒交给你。想跳过播报，直接按 <b>说话</b> 或输入文字即可打断。</p>
    </div>
    <div class="ctrl">
      <button class="btn-go" id="callBtn" type="button">接通</button>
      <button class="btn-talk" id="talkBtn" type="button" disabled>说话</button>
      <form id="form">
        <input type="text" id="say" placeholder="输入要说的话，例如：帮我们规划下周的产品发布" autocomplete="off" disabled>
        <button type="submit" id="sendBtn" disabled>发送</button>
      </form>
      <p class="hint" id="hint">挂断时Anita会口头做纪要。说「结束通话」也会挂断。</p>
    </div>
  </section>

  <aside class="rules" aria-label="协作规则">
    <h2>通话协作规则</h2>
    <p class="meta">十条，按播报顺序部署。部署完成的规则显示「已部署」。</p>
    <ol id="rules"></ol>
  </aside>

  <section class="minutes" id="minutes" hidden></section>
</div>

<script>
const AGENTS = [
  {id:"Claude", role:"主持人", duty:"分配话筒、控制节奏、裁决分歧", c:"--a1", pitch:1.0, rate:1.08},
  {id:"Codex", role:"方案师", duty:"拆解需求、给出方案和步骤", c:"--a2", pitch:0.8, rate:1.1},
  {id:"Cynthia", role:"质检员", duty:"找风险、提异议、核对事实", c:"--a3", pitch:1.3, rate:1.0},
  {id:"Anita", role:"记录员", duty:"复述确认、记录决议和待办", c:"--a4", pitch:1.45, rate:1.1},
];
const RULES = [
  {k:"单一话筒", t:"同一时刻只有一个声音。主持人Claude分配话筒，其他智能体未被点名不开口。", s:"第一条，单一话筒。同一时刻只有一人发言，话筒由我分配。"},
  {k:"开口报名", t:"每次发言先报自己的名字。电话里听众看不到人，名字就是身份。", s:"第二条，开口先报名字。"},
  {k:"短句发言", t:"每段不超过三句、约二十秒。复杂内容拆成多轮，不念列表、代码和网址。", s:"第三条，每次发言不超过三句。"},
  {k:"明确交棒", t:"发言以「交给某某」或「完毕」结尾。没有交棒语，下一位不开口。", s:"第四条，说完要交棒，用交给谁，或者完毕结尾。"},
  {k:"用户优先", t:"用户随时可以打断。用户一开口，所有智能体立刻停下，下一轮先回应用户。", s:"第五条，用户随时可以打断，用户优先。"},
  {k:"复述确认", t:"决定、数字、时间、人名，由Anita复述一遍，用户说「对」才算定下。", s:"第六条，关键信息由Anita复述，用户确认才算数。"},
  {k:"异议上报", t:"不同意见以「异议」开头，一句话讲清理由。Claude裁决；两轮无共识，交用户决定。", s:"第七条，有异议直接提，两轮谈不拢，交给用户决定。"},
  {k:"不懂就问", t:"没听清或信息不够时直接提问。不猜测、不编造，不确定就说不确定。", s:"第八条，不确定就问，不许编造。"},
  {k:"口头授权", t:"执行、花钱、对外发送这类事，必须听到用户说「确认执行」才进行。", s:"第九条，执行类操作，必须听到用户说确认执行。"},
  {k:"挂断纪要", t:"挂断前Anita口头总结结论、待办和负责人。通话结果以纪要为准。", s:"第十条，挂断前由Anita做纪要。"},
];
const DEPLOY = [
  {sp:"Claude", tx:"通话接通。我是Claude，本次通话的主持人。现在部署协作规则，一共十条。"},
  ...RULES.map((r,i)=>({sp:"Claude", tx:r.s, rule:i})),
  {sp:"Claude", tx:"规则播报完毕。现在点名，Codex、Cynthia、Anita依次确认。交给Codex。"},
  {sp:"Codex", tx:"Codex收到，十条规则已加载。我负责拆解需求、给出方案。完毕。", checkin:true},
  {sp:"Cynthia", tx:"Cynthia收到，规则已加载。我负责找风险、提异议。完毕。", checkin:true},
  {sp:"Anita", tx:"Anita收到，规则已加载。我负责复述确认和会议纪要。完毕。", checkin:true},
  {sp:"Claude", tx:"四位全部在线，规则部署完成。请讲今天要协作的事。交给用户。", done:true},
];

const $ = id => document.getElementById(id);
const logEl=$("log"), statusEl=$("status");
let sample=null, inCall=false, deployed=false, history=[], ctl=null, t0=0, tick=null;
let queue=[], speaking=false, epoch=0, muted=false, voices=[];
const tts = "speechSynthesis" in window ? window.speechSynthesis : null;

// ---------- render ----------
$("seats").innerHTML = AGENTS.map(a=>`<div class="seat" id="seat-${a.id}" style="--c:var(${a.c})">
  <span class="nm">${a.id}</span><span class="rl">${a.role} · ${a.duty}</span>
  <span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span class="st">待签到</span></div>`).join("");
$("rules").innerHTML = RULES.map((r,i)=>`<li id="rule-${i}"><span class="no">R${String(i+1).padStart(2,"0")}</span>
  <span class="k">${r.k}</span><span class="s">待部署</span><span class="t">${r.t}</span></li>`).join("");

function colorOf(sp){ const a=AGENTS.find(x=>x.id===sp); return a?`var(${a.c})`:"var(--you)"; }
function now(){ const s=Math.floor((Date.now()-t0)/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function addLine(sp, tx, sys){
  $("empty")?.remove();
  const d=document.createElement("div"); d.className="ln"+(sys?" sys":""); d.style.setProperty("--c", colorOf(sp));
  const w=document.createElement("span"); w.className="who"; w.textContent=sys?"系统":sp;
  const t=document.createElement("span"); t.className="tx"; t.textContent=tx;
  const m=document.createElement("span"); m.className="tm"; m.textContent=inCall?now():"";
  d.append(w,t,m); logEl.append(d); logEl.scrollTop=logEl.scrollHeight;
}
function setStatus(s){ statusEl.textContent=s; }
function setActive(sp){ AGENTS.forEach(a=>$("seat-"+a.id).classList.toggle("talk", a.id===sp)); }
function checkIn(sp){ const el=$("seat-"+sp); el.classList.add("in"); el.querySelector(".st").textContent="已签到"; }
function markRule(i){ document.querySelectorAll(".rules li").forEach(li=>li.classList.remove("now"));
  const li=$("rule-"+i); li.classList.add("dep","now"); li.querySelector(".s").textContent="已部署"; }

// ---------- speech out ----------
function loadVoices(){ if(!tts) return; voices=tts.getVoices().filter(v=>/^zh/i.test(v.lang)).sort((a,b)=>(/CN/i.test(b.lang))-(/CN/i.test(a.lang))); }
if(tts){ loadVoices(); tts.addEventListener?.("voiceschanged", loadVoices); }
function say(turn){ queue.push(turn); pump(); }
function pump(){
  if(speaking||!queue.length) return;
  const turn=queue.shift(), my=++epoch; speaking=true;
  setActive(turn.sp); addLine(turn.sp, turn.tx); history.push({sp:turn.sp, tx:turn.tx}); turn.onstart?.();
  const done=()=>{ if(my!==epoch) return; speaking=false; setActive(null); turn.onend?.(); pump(); };
  const spoken = AGENTS.some(a=>a.id===turn.sp) && !turn.tx.startsWith(turn.sp) ? turn.sp+"："+turn.tx : turn.tx; // R2: 开口报名
  if(muted||!tts){ setTimeout(done, Math.min(5000, 600+spoken.length*110)); return; }
  const a=AGENTS.find(x=>x.id===turn.sp)||AGENTS[0], idx=AGENTS.indexOf(a);
  const u=new SpeechSynthesisUtterance(spoken); u.lang="zh-CN"; u.pitch=a.pitch; u.rate=a.rate;
  if(voices.length) u.voice=voices[idx%voices.length];
  u.onend=done; u.onerror=done; tts.speak(u);
  setTimeout(done, 4000+spoken.length*450); // 语音引擎卡住时兜底，保证话筒继续流转
}
function stopAll(){ // R5: 用户优先，立即静默
  queue.length=0; epoch++; speaking=false; tts?.cancel(); setActive(null);
  if(ctl){ ctl.abort(); ctl=null; }
}

// ---------- call ----------
$("callBtn").onclick=()=>{ inCall ? hangUp() : connect(); };
function connect(){
  inCall=true; deployed=false; history=[]; t0=Date.now();
  logEl.innerHTML=""; $("minutes").hidden=true;
  document.querySelectorAll(".rules li").forEach(li=>{li.classList.remove("dep","now"); li.querySelector(".s").textContent="待部署";});
  AGENTS.forEach(a=>{const el=$("seat-"+a.id); el.classList.remove("in"); el.querySelector(".st").textContent="待签到";});
  checkIn("Claude");
  $("bar").classList.add("live"); tick=setInterval(()=>$("timer").textContent=now(),500);
  const cb=$("callBtn"); cb.textContent="挂断"; cb.className="btn-end";
  ["talkBtn","say","sendBtn"].forEach(id=>$(id).disabled=false);
  setStatus("通话中 · 正在部署规则");
  DEPLOY.forEach(d=>say({sp:d.sp, tx:d.tx,
    onstart:()=>{ if(d.rule!=null) markRule(d.rule); if(d.checkin) checkIn(d.sp); },
    onend:()=>{ if(d.done) finishDeploy(); }}));
}
function finishDeploy(){
  if(deployed) return; deployed=true;
  AGENTS.forEach(a=>checkIn(a.id)); RULES.forEach((_,i)=>markRule(i));
  document.querySelectorAll(".rules li").forEach(li=>li.classList.remove("now"));
  setStatus(sample ? "规则已部署 · 话筒在你手里" : "规则已部署 · 此视图连不上 Claude，智能体无法回答");
}
async function hangUp(){
  stopAll(); finishDeploy();
  const userSaid = history.some(h=>h.sp==="用户");
  inCall=false; clearInterval(tick); $("bar").classList.remove("live");
  const cb=$("callBtn"); cb.textContent="重新接通"; cb.className="btn-go";
  ["talkBtn","say","sendBtn"].forEach(id=>$(id).disabled=true);
  setStatus("已挂断");
  if(!userSaid||!sample){ addLine("", "通话结束。本次没有可记录的讨论。", true); return; }
  setStatus("已挂断 · Anita正在整理纪要");
  ctl=new AbortController();
  try{
    const m = await sample.json(summaryPrompt(), {modelTier:"quick", cache:false, signal:ctl.signal});
    renderMinutes(m);
    if(m && m.spoken){ inCall=true; say({sp:"Anita", tx:String(m.spoken).slice(0,200), onend:()=>{inCall=false;}}); }
    setStatus("已挂断 · 纪要见下方");
  }catch(e){ if(e.code!=="cancelled"){ addLine("", "纪要生成失败："+errText(e), true); setStatus("已挂断"); } }
}
function renderMinutes(m){
  const sec=$("minutes"); sec.innerHTML=""; sec.hidden=false;
  const h=document.createElement("h2"); h.textContent="通话纪要 · Anita"; sec.append(h);
  const block=(title, items, fmt)=>{ if(!Array.isArray(items)||!items.length) return;
    const t=document.createElement("h3"); t.textContent=title; const ul=document.createElement("ul");
    items.forEach(x=>{const li=document.createElement("li"); li.textContent=fmt(x); ul.append(li);}); sec.append(t,ul); };
  block("结论", m?.conclusions, String);
  block("待办", m?.todos, x=>(x&&x.owner? x.owner+"：":"")+(x&&x.task!=null? x.task : String(x)));
  block("待定问题", m?.open, String);
}

// ---------- user input ----------
function userSays(text){
  text=text.trim(); if(!text||!inCall) return;
  stopAll(); finishDeploy();
  addLine("用户", text); history.push({sp:"用户", tx:text});
  if(/结束通话|挂断|再见/.test(text)){ hangUp(); return; }
  respond();
}
$("form").onsubmit=e=>{ e.preventDefault(); const v=$("say").value; $("say").value=""; userSays(v); };
$("say").addEventListener("input",()=>{ if(speaking||ctl) stopAll(); }); // 打字即打断
$("muteBtn").onclick=()=>{ muted=!muted; $("muteBtn").setAttribute("aria-pressed",muted); $("muteBtn").textContent=muted?"恢复播报":"静音播报"; if(muted) tts?.cancel(); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOK=!!SR, rec=null;
function micOff(){ micOK=false; $("talkBtn").textContent="打断"; $("hint").textContent="这个视图里麦克风不可用。按「打断」让智能体停下，再用键盘或输入法自带的语音键输入。说「结束通话」也会挂断。"; }
if(!micOK) micOff();
$("talkBtn").onclick=()=>{
  stopAll();
  if(!micOK){ $("say").focus(); return; }
  if(rec){ rec.stop(); return; }
  try{
    rec=new SR(); rec.lang="zh-CN"; rec.interimResults=true; rec.continuous=false;
    let final="";
    rec.onresult=e=>{ let s=""; for(const r of e.results){ s+=r[0].transcript; } final=s; $("say").value=s; };
    rec.onerror=e=>{ if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)) micOff(); };
    rec.onend=()=>{ rec=null; $("talkBtn").classList.remove("rec"); if(micOK) $("talkBtn").textContent="说话"; if(final){ $("say").value=""; userSays(final); } };
    rec.start(); $("talkBtn").classList.add("rec"); $("talkBtn").textContent="听写中，点我结束"; setStatus("正在听你说");
  }catch(_){ rec=null; micOff(); $("say").focus(); }
};

// ---------- agents ----------
function rulesText(){ return RULES.map((r,i)=>`R${i+1} ${r.k}：${r.t}`).join("\n"); }
function logText(){ return history.slice(-40).map(h=>`${h.sp}：${h.tx}`).join("\n"); }
function turnPrompt(){
  return `你在扮演一通多智能体语音电话里的四位智能体。你写的每一句都会被直接合成语音播放给用户。

【通话协作规则，必须遵守】
${rulesText()}

【参会者】
用户：人类，最高优先级
${AGENTS.map(a=>`${a.id}（${a.role}）：${a.duty}`).join("\n")}

【通话记录，从早到晚】
${logText()}

【现在要做的】
针对用户最后一句话，写出智能体接下来的发言：
- 1到4条，按发言顺序。默认由Claude先开口回应并分配话筒；如果用户点名某位智能体，就由他先说。只让真正有话可说的智能体发言。
- 每条最多三句、60个汉字以内，口语，不用列表、符号、表情、网址、代码。
- text 里不要写自己的名字，播放时系统会自动报名。
- 每条以交棒语结尾：交给某某，或者完毕。最后一条必须交给用户，或者向用户提一个明确的问题。
- 用户确认了决定、数字、时间或人名时，安排Anita复述。需要执行、花钱、对外发送的事，先请用户说「确认执行」。信息不足就提问，不编造。
输出格式：每条发言单独一行 JSON，形如 {"speaker":"Claude","text":"……"}，不要代码块，不要任何其他文字。`;
}
function summaryPrompt(){
  return `下面是一通多智能体语音协作电话的记录。你是记录员Anita，请按规则R10写纪要。

【通话记录】
${logText()}

只回复一个 JSON 对象：{"spoken":"挂断前的口头纪要，最多四句，口语，以'纪要完毕'结尾","conclusions":["结论"],"todos":[{"owner":"负责人","task":"待办"}],"open":["还没定的问题"]}。没有的项给空数组。不要编造记录里没有的内容。`;
}
function errText(e){
  return ({not_granted:"你没有允许这个页面使用 Claude。", sampling_disabled:"这个账号暂时用不了 Claude。", rate_limited:"请求太频繁，稍等一会儿再说。",
    session_expired:"登录已过期，请重新登录。", refused:"这段内容无法回答，换个说法试试。"})[e?.code] || "连接中断，请再说一次。";
}
async function respond(){
  if(!sample){ say({sp:"Claude", tx:"这个视图连不上 Claude，我们没法回答。规则已经部署好，换到 Claude 应用里打开就能继续。交给用户。"}); return; }
  const my=ctl=new AbortController(); setStatus("智能体正在组织发言");
  let pending="", n=0;
  const handle=line=>{
    line=line.trim().replace(/^```(json)?/,"").replace(/```$/,"").trim(); if(!line||n>=4) return;
    let o; try{ o=JSON.parse(line); }catch(_){ return; }
    if(!o||typeof o.text!=="string"||!o.text.trim()) return;
    const sp = AGENTS.some(a=>a.id===o.speaker) ? o.speaker : "Claude";
    n++; say({sp, tx:o.text.trim().slice(0,160)});
  };
  try{
    await sample(turnPrompt(), {modelTier:"quick", cache:false, signal:my.signal, onText:({delta})=>{
      const lines=(pending+delta).split("\n"); pending=lines.pop(); lines.forEach(handle); }});
    handle(pending);
    if(ctl===my){ ctl=null; setStatus("通话中 · 话筒在你手里"); }
  }catch(e){
    if(e.code==="cancelled") return;
    if(ctl===my) ctl=null;
    addLine("", errText(e), true); setStatus("通话中");
  }
}

(async()=>{ try{ sample = await window.claude?.use?.("sample") ?? null; }catch(_){ sample=null; }
  if(!sample) $("hint").textContent += " 当前视图连不上 Claude：规则部署可以完整演示，智能体不会回答问题。";
})();
</script>
