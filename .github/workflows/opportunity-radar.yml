name: 机会雷达

on:
  schedule:
    - cron: '17 0 * * *' # 每天北京时间 08:17
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: opportunity-radar

jobs:
  radar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opportunity-radar
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 AI 评估依赖（仅在配置了密钥时）
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install --no-audit --no-fund --no-package-lock

      - name: 生成日报
        run: node radar.js

      - name: 提交日报
        run: |
          git config user.name "opportunity-radar"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/seen.json
          git diff --cached --quiet || git commit -m "机会日报 $(TZ=Asia/Shanghai date +%F)"
          git push

      - name: 用 Issue 推送日报（GitHub 会发邮件通知）
        continue-on-error: true
        run: |
          d=$(TZ=Asia/Shanghai date +%F)
          gh issue create --title "机会日报 $d" --body-file "reports/$d.md"
